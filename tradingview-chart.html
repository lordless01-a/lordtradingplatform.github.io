<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Chart</title>
<style>
  html, body { height: 100%; margin: 0; background: #0e1116; }
  .tradingview-widget-container { height: 100%; width: 100%; }
  .tradingview-widget-copyright { height: 32px; font: 13px/32px sans-serif; text-align: center; color: #9aa4b2; }
  .tradingview-widget-copyright a { color: #5b9cf6; text-decoration: none; }
</style>
</head>
<body>
<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
  <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank"><span class="blue-text">Track all markets on TradingView</span></a></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
    "autosize": true,
    "symbol": "FX:EURUSD",
    "interval": "15",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "7",
    "locale": "en",
    "allow_symbol_change": true,
    "withdateranges": true,
    "support_host": "https://www.tradingview.com"
  }
  </script>
</div>
<!-- TradingView Widget END -->
</body>
</html>
